name: symmetry-matters
channels:
  - pytorch
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.14
  - pip=24.2
  - setuptools=75.1.0
  - wheel=0.44.0
  - numpy=1.26.4
  - scipy=1.11.4
  - matplotlib=3.8.4
  - open3d=0.18.0
  - pytorch=2.2.2
  - cpuonly=2.0
  - jupyterlab=4.2.5
  - notebook=7.2.2
  - nbconvert=7.16.4
  - ipykernel=6.29.5
  - ipython=8.27.0
  - pyyaml=6.0.2
  - tqdm=4.66.5
  - pip:
      - google-api-python-client==2.149.0
      - google-auth==2.35.0
      - google-auth-httplib2==0.2.0
      - google-auth-oauthlib==1.2.1

# XCube note:
# Dataset_Preparation/CreatePKLFiles_DatasetForXCube.py requires the CUDA fVDB extension shipped with the XCube codebase. Please, install it inside the dedicated XCube environment by following https://github.com/NicolasPCS/XCube_necs. 
# LION evaluation note:
# Evaluation/compute_scores.py imports utils.eval_helper from LION. Please, clone https://github.com/NicolasPCS/LION_necs and expose that checkout through PYTHONPATH as documented in the repository README.